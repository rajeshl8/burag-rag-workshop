[project]
name = "burag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rajeshlingam", email = "lingamrajesh06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "fonttools>=4.67.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pandas>=3.0.6",
    "pymupdf>=2.0",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "tqdm>=4.70.1",
    "typesense>=2.1.0",
]

[project.scripts]
burag = "burag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
